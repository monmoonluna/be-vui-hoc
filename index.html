<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bé Vui Học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mali:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="btn-home" type="button">Bé Vui Học</button>
    <div class="topbar-right">
      <span class="star-total" id="star-total" aria-label="Tổng số sao">★ 0</span>
      <button class="sound" id="btn-sound" type="button" aria-pressed="true">Âm thanh: bật</button>
    </div>
  </header>

  <main>
    <section id="home">
      <div class="tabs" role="tablist" aria-label="Chọn môn học">
        <button class="tab" id="tab-mg" role="tab" type="button">Mẫu giáo</button>
        <button class="tab" id="tab-toan" role="tab" type="button">Vở Toán</button>
        <button class="tab" id="tab-tv" role="tab" type="button">Vở Tiếng Việt</button>
        <button class="tab" id="tab-tho" role="tab" type="button">Học thuộc thơ</button>
        <button class="tab" id="tab-sach" role="tab" type="button">Bài tập theo sách</button>
      </div>
      <div class="book-switch" id="book-switch" hidden>
        <button class="book-btn" id="book-tv" type="button">Sách Tiếng Việt</button>
        <button class="book-btn" id="book-toan" type="button">Sách Toán</button>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="play" hidden></section>
    <section id="result" hidden></section>
    <section id="alphabet" hidden></section>
    <section id="poem" hidden></section>
  </main>

  <script src="js/core.js"></script>
  <script src="js/toan.js"></script>
  <script src="js/tiengviet.js"></script>
  <script src="js/tho.js"></script>
  <script src="js/sach.js"></script>
  <script src="js/maugiao.js"></script>
  <script src="js/sachtoan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
